name: Build NXEmu OS module

on:
  workflow_dispatch:
  push:
    branches:
      - fix-mk8-patch-storage

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build nxemu-os
        shell: pwsh
        run: |
          msbuild .\nxemu.sln `
            /m `
            /restore `
            /t:nxemu-os `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:BuildInParallel=true `
            /p:UseMultiToolTask=true `
            /v:minimal

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $expected = @(
            "modules\x64\operating_system\nxemu-os.dll",
            "modules\x64\operating_system\nxemu-os.pdb",
            "modules\x64\operating_system\nxemu-os.lib"
          )
          foreach ($path in $expected) {
            if (Test-Path $path) {
              Write-Host $path
              Copy-Item $path artifacts\ -Force
            }
          }
          Get-ChildItem artifacts
          if (-not (Test-Path artifacts\nxemu-os.dll)) {
            throw "nxemu-os.dll was not produced"
          }

      - name: Upload nxemu-os artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxemu-os-release-x64
          path: artifacts/*
          if-no-files-found: error
