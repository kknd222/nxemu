name: Build Windows cheat patch

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'GitHub hosted runner label, e.g. windows-2025, windows-2022, windows-latest'
        required: false
        default: 'windows-2025'
  push:
    branches:
      - cheat-loader
      - kknd222/cheat-loader
      - kknd222/cheat-loader-530

jobs:
  build-windows:
    runs-on: ${{ github.event.inputs.runner_label || 'windows-2025' }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build nxemu-os
        shell: pwsh
        run: |
          msbuild .\nxemu.sln /m /restore /p:Configuration=Release /p:Platform=x64 /t:nxemu-os /v:m

      - name: Build nx_tzdb generated headers
        shell: pwsh
        run: |
          msbuild .\nxemu.sln /m /restore /p:Configuration=Release /p:Platform=x64 /t:nx_tzdb /v:m

      - name: Build nxemu-loader
        shell: pwsh
        run: |
          msbuild .\nxemu.sln /m /restore /p:Configuration=Release /p:Platform=x64 /t:nxemu-loader /v:m

      - name: Show produced files
        shell: pwsh
        run: |
          Get-ChildItem .\modules -Recurse -File | Select-Object FullName,Length,LastWriteTime

      - name: Package patched modules
        shell: pwsh
        run: |
          $pkg = "artifact\NXEmu_cheat_patch"
          New-Item -ItemType Directory -Force "$pkg\modules\operating_system" | Out-Null
          New-Item -ItemType Directory -Force "$pkg\modules\loader" | Out-Null

          Copy-Item ".\modules\x64\operating_system\nxemu-os.dll" "$pkg\modules\operating_system\nxemu-os.dll" -Force
          Copy-Item ".\modules\x64\loader\nxemu-loader.dll" "$pkg\modules\loader\nxemu-loader.dll" -Force

          if (Test-Path ".\modules\x64\operating_system\nxemu-os.pdb") {
            Copy-Item ".\modules\x64\operating_system\nxemu-os.pdb" "$pkg\modules\operating_system\nxemu-os.pdb" -Force
          }
          if (Test-Path ".\modules\x64\loader\nxemu-loader.pdb") {
            Copy-Item ".\modules\x64\loader\nxemu-loader.pdb" "$pkg\modules\loader\nxemu-loader.pdb" -Force
          }

          @"
          Install:
          1. Close NXEmu first.
          2. Back up D:\NXEmu\modules\operating_system\nxemu-os.dll and D:\NXEmu\modules\loader\nxemu-loader.dll.
          3. Copy this artifact's modules folder over D:\NXEmu\modules.

          Cheat path examples:
          D:\NXEmu\user\load\01008CF01BAAC000\cheats\09A15C8259828A41.txt
          D:\NXEmu\user\load\01008CF01BAAC000\<mod name>\cheats\09A15C8259828A41.txt
          "@ | Set-Content -Encoding UTF8 "$pkg\README.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NXEmu_cheat_patch_windows_x64
          path: artifact/NXEmu_cheat_patch
